name: Deploy Shotty

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /var/www/shotty
            git fetch origin
            git reset --hard origin/main
            cd shotty
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart shotty || pm2 start ecosystem.config.js
            pm2 save
            echo "Deployed at $(date)"
